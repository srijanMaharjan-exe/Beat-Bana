<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBana - Log In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    :root {
      --primary: #6c4bff;
      --primary-dark: #5135e0;
      --secondary: #ff4b8c;
      --dark: #121212;
      --gray: #2a2a2a;
      --light-gray: #3a3a3a;
      --text: #ffffff;
      --text-secondary: #b0b0b0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      background-color: var(--dark);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    a {
      text-decoration: none;
      color: inherit;
    }
    
    button, .button {
      cursor: pointer;
      border: none;
      outline: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .container {
      width: 100%;
      padding: 0 20px;
      margin: 0 auto;
      max-width: 1200px;
    }
    
    /* Header Styles */
    .header {
      background-color: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 0;
      border-bottom: 1px solid var(--light-gray);
    }
    
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-icon {
      height: 32px;
      width: auto;
    }
    
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      background: radial-gradient(circle at 50% 20%, #2d2d5f, var(--dark));
    }
    
    .login-container {
      background-color: var(--gray);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid var(--light-gray);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .login-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .form-input {
      background-color: var(--dark);
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      outline: none;
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
    }
    
    .remember-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    
    .forgot-password {
      color: var(--primary);
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    .forgot-password:hover {
      color: var(--secondary);
    }
    
    .login-button {
      background-color: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }
    
    .login-button:hover {
      background-color: var(--primary-dark);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--light-gray);
    }
    
    .divider::before {
      margin-right: 10px;
    }
    
    .divider::after {
      margin-left: 10px;
    }
    
    .social-login {
      display: flex;
      gap: 12px;
    }
    
    .social-button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--dark);
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      transition: background-color 0.2s ease;
    }
    
    .social-button:hover {
      background-color: var(--light-gray);
    }
    
    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .signup-link a {
      color: var(--primary);
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    .signup-link a:hover {
      color: var(--secondary);
    }
    
    /* Footer */
    .footer {
      background-color: var(--gray);
      padding: 20px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--light-gray);
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }
    
    .footer-link {
      transition: color 0.2s ease;
    }
    
    .footer-link:hover {
      color: var(--text);
    }
    
    /* Responsive */
    @media (min-width: 768px) {
      .container {
        padding: 0 40px;
      }
    }

  .error-message {
    color: #f44336;
    font-size: 0.85rem;
    margin-top: 5px;
  }
  
  .input-error {
    border-color: #f44336 !important;
  }
  
  /* Add loading spinner animation */
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .fa-spin {
    animation: spin 1s linear infinite;
  }
</style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="../index.html" class="logo">
          <img src="Beat Bana.png" alt="BeatBana Logo" class="logo-icon" />
          <span class="logo-text">BeatBana</span>
        </a>
      </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="login-container">
        <div class="login-header">
          <h1 class="login-title">Welcome Back</h1>
          <p class="login-subtitle">Log in to continue your musical journey</p>
        </div>
        
        <form class="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          </div>
          
          <div class="form-options">
            <div class="remember-me">
              <input type="checkbox" id="remember" class="remember-checkbox">
              <label for="remember">Remember me</label>
            </div>
            
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>
          
          <button type="submit" class="login-button">Log In</button>
        </form>
        
        <div class="divider">or continue with</div>
        
        <div class="social-login">
          <a href="#" class="social-button">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </a>
          
          <a href="#" class="social-button">
            <i class="fab fa-apple"></i>
            <span>Apple</span>
          </a>
        </div>
        
        <div class="signup-link">
          Don't have an account? <a href="../signUp/index.html">Sign up</a>
        </div>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-copyright">© 2025 BeatBana. All rights reserved.</div>
      <div class="footer-links">
        <a href="#" class="footer-link">Privacy Policy</a>
        <a href="#" class="footer-link">Terms of Service</a>
        <a href="#" class="footer-link">Help Center</a>
      </div>
    </div>
  </footer>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.querySelector('.login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Simple validation
      let isValid = true;
      
      if (!emailInput.value || !emailInput.value.includes('@')) {
        showError(emailInput, 'Please enter a valid email address');
        isValid = false;
      } else {
        clearError(emailInput);
      }
      
      if (!passwordInput.value || passwordInput.value.length < 6) {
        showError(passwordInput, 'Password must be at least 6 characters');
        isValid = false;
      } else {
        clearError(passwordInput);
      }
      
      if (isValid) {
        // Show loading state
        const submitButton = loginForm.querySelector('button[type="submit"]');
        submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
        submitButton.disabled = true;
        
        // Simulate login (would be replaced with actual API call)
        setTimeout(() => {
          window.location.href = '../HomePage/index.html';
        }, 1500);
      }
    });
    
    function showError(input, message) {
      const formGroup = input.closest('.form-group');
      const errorElement = formGroup.querySelector('.error-message') || document.createElement('div');
      
      if (!formGroup.querySelector('.error-message')) {
        errorElement.className = 'error-message';
        formGroup.appendChild(errorElement);
      }
      
      errorElement.textContent = message;
      input.classList.add('input-error');
    }
    
    function clearError(input) {
      const formGroup = input.closest('.form-group');
      const errorElement = formGroup.querySelector('.error-message');
      
      if (errorElement) {
        errorElement.textContent = '';
      }
      
      input.classList.remove('input-error');
    }
  });
</script>
</body>
</html>
