<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBana - Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    :root {
      --primary: #6c4bff;
      --primary-dark: #5135e0;
      --secondary: #ff4b8c;
      --dark: #121212;
      --gray: #2a2a2a;
      --light-gray: #3a3a3a;
      --text: #ffffff;
      --text-secondary: #b0b0b0;
      --error: #f44336;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      background-color: var(--dark);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    a {
      text-decoration: none;
      color: inherit;
    }
    
    button, .button {
      cursor: pointer;
      border: none;
      outline: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .container {
      width: 100%;
      padding: 0 20px;
      margin: 0 auto;
      max-width: 1200px;
    }
    
    /* Header Styles */
    .header {
      background-color: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 0;
      border-bottom: 1px solid var(--light-gray);
    }
    
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-icon {
      height: 32px;
      width: auto;
    }
    
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      background: radial-gradient(circle at 50% 20%, #2d2d5f, var(--dark));
    }
    
    .signup-container {
      background-color: var(--gray);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid var(--light-gray);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    
    .signup-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .signup-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .signup-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }
    
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .form-input {
      background-color: var(--dark);
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      outline: none;
    }
    
    .form-input.input-error {
      border-color: var(--error);
    }
    
    .error-message {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 5px;
    }
    
    .form-options {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    
    .terms-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    
    .signup-button {
      background-color: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }
    
    .signup-button:hover {
      background-color: var(--primary-dark);
    }
    
    .signup-button:disabled {
      background-color: var(--light-gray);
      cursor: not-allowed;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--light-gray);
    }
    
    .divider::before {
      margin-right: 10px;
    }
    
    .divider::after {
      margin-left: 10px;
    }
    
    .social-signup {
      display: flex;
      gap: 12px;
    }
    
    .social-button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--dark);
      border: 1px solid var(--light-gray);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      transition: background-color 0.2s ease;
    }
    
    .social-button:hover {
      background-color: var(--light-gray);
    }
    
    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .login-link a {
      color: var(--primary);
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    .login-link a:hover {
      color: var(--secondary);
    }
    
    /* Password Strength Meter */
    .password-strength {
      margin-top: 8px;
    }
    
    .strength-meter {
      height: 4px;
      background-color: var(--dark);
      border-radius: 2px;
      margin-bottom: 5px;
      display: flex;
    }
    
    .strength-segment {
      height: 100%;
      flex: 1;
      margin-right: 2px;
      border-radius: 2px;
      background-color: var(--dark);
      transition: background-color 0.3s ease;
    }
    
    .strength-segment:last-child {
      margin-right: 0;
    }
    
    .strength-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    /* Footer */
    .footer {
      background-color: var(--gray);
      padding: 20px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--light-gray);
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }
    
    .footer-link {
      transition: color 0.2s ease;
    }
    
    .footer-link:hover {
      color: var(--text);
    }
    
    /* Loading Spinner */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .fa-spin {
      animation: spin 1s linear infinite;
    }
    
    /* Responsive */
    @media (min-width: 768px) {
      .container {
        padding: 0 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="../index.html" class="logo">
          <img src="../Images/Beat Bana.png" alt="BeatBana Logo" class="logo-icon" />
          <span class="logo-text">BeatBana</span>
        </a>
      </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="signup-container">
        <div class="signup-header">
          <h1 class="signup-title">Create Account</h1>
          <p class="signup-subtitle">Join the BeatBana community</p>
        </div>
        
        <form class="signup-form" id="signup-form">
          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="Enter your name" required>
          </div>
          
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Create a password" required>
            
            <div class="password-strength">
              <div class="strength-meter">
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
              </div>
              <div class="strength-text">Password strength: Too weak</div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password" required>
          </div>
          
          <div class="form-options">
            <input type="checkbox" id="terms" class="terms-checkbox" required>
            <label for="terms">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a></label>
          </div>
          
          <button type="submit" class="signup-button">Create Account</button>
        </form>
        
        <div class="divider">or sign up with</div>
        
        <div class="social-signup">
          <a href="#" class="social-button">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </a>
          
          <a href="#" class="social-button">
            <i class="fab fa-apple"></i>
            <span>Apple</span>
          </a>
        </div>
        
        <div class="login-link">
          Already have an account? <a href="../logIn/index.html">Log in</a>
        </div>
      </div>
    </div>
  </main>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-copyright">© 2025 BeatBana. All rights reserved.</div>
      <div class="footer-links">
        <a href="#" class="footer-link">Privacy Policy</a>
        <a href="#" class="footer-link">Terms of Service</a>
        <a href="#" class="footer-link">Help Center</a>
      </div>
    </div>
  </footer>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signup-form');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirm-password');
      const termsCheckbox = document.getElementById('terms');
      const strengthSegments = document.querySelectorAll('.strength-segment');
      const strengthText = document.querySelector('.strength-text');
      
      // Password strength checker
      passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;
        let strength = 0;
        
        // Length check
        if (password.length >= 8) {
          strength += 1;
        }
        
        // Uppercase check
        if (/[A-Z]/.test(password)) {
          strength += 1;
        }
        
        // Number check
        if (/[0-9]/.test(password)) {
          strength += 1;
        }
        
        // Special character check
        if (/[^A-Za-z0-9]/.test(password)) {
          strength += 1;
        }
        
        // Update strength meter
        strengthSegments.forEach((segment, index) => {
          if (index < strength) {
            segment.style.backgroundColor = getStrengthColor(strength);
          } else {
            segment.style.backgroundColor = 'var(--dark)';
          }
        });
        
        // Update strength text
        strengthText.textContent = `Password strength: ${getStrengthText(strength)}`;
        strengthText.style.color = getStrengthColor(strength);
      });
      
      // Form submission
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Validate form
        let isValid = true;
        
        if (!nameInput.value.trim()) {
          showError(nameInput, 'Please enter your name');
          isValid = false;
        } else {
          clearError(nameInput);
        }
        
        if (!emailInput.value || !isValidEmail(emailInput.value)) {
          showError(emailInput, 'Please enter a valid email address');
          isValid = false;
        } else {
          clearError(emailInput);
        }
        
        if (!passwordInput.value || passwordInput.value.length < 8) {
          showError(passwordInput, 'Password must be at least 8 characters');
          isValid = false;
        } else {
          clearError(passwordInput);
        }
        
        if (passwordInput.value !== confirmPasswordInput.value) {
          showError(confirmPasswordInput, 'Passwords do not match');
          isValid = false;
        } else {
          clearError(confirmPasswordInput);
        }
        
        if (!termsCheckbox.checked) {
          showError(termsCheckbox, 'You must agree to the Terms of Service');
          isValid = false;
        } else {
          clearError(termsCheckbox);
        }
        
        if (isValid) {
          // Show loading state
          const submitButton = signupForm.querySelector('button[type="submit"]');
          submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
          submitButton.disabled = true;
          
          // Simulate account creation (would be replaced with actual API call)
          setTimeout(() => {
            window.location.href = '../HomePage/index.html';
          }, 2000);
        }
      });
      
      // Helper functions
      function showError(input, message) {
        const formGroup = input.closest('.form-group') || input.parentElement;
        const errorElement = formGroup.querySelector('.error-message') || document.createElement('div');
        
        if (!formGroup.querySelector('.error-message')) {
          errorElement.className = 'error-message';
          formGroup.appendChild(errorElement);
        }
        
        errorElement.textContent = message;
        if (input.classList) {
          input.classList.add('input-error');
        }
      }
      
      function clearError(input) {
        const formGroup = input.closest('.form-group') || input.parentElement;
        const errorElement = formGroup.querySelector('.error-message');
        
        if (errorElement) {
          errorElement.textContent = '';
        }
        
        if (input.classList) {
          input.classList.remove('input-error');
        }
      }
      
      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
      
      function getStrengthColor(strength) {
        switch (strength) {
          case 0:
            return '#f44336'; // Red
          case 1:
            return '#ff9800'; // Orange
          case 2:
            return '#ffeb3b'; // Yellow
          case 3:
            return '#4caf50'; // Light green
          case 4:
            return '#2e7d32'; // Dark green
          default:
            return '#f44336'; // Red
        }
      }
      
      function getStrengthText(strength) {
        switch (strength) {
          case 0:
            return 'Too weak';
          case 1:
            return 'Weak';
          case 2:
            return 'Medium';
          case 3:
            return 'Strong';
          case 4:
            return 'Very strong';
          default:
            return 'Too weak';
        }
      }
    });
  </script>
</body>
</html>
